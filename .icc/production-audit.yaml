profiles:
  - name: quantum-quake-runtime
    default: true
    targets:
      - qge-runtime-performance
      - qge-deep-codebase-audit
    presets:
      - shell-hardening
      - c-stub-bodies
    # After tree-sitter C/C++ parsing is enabled, the remaining no-symbol files
    # below this line count are generated data tables, platform registries,
    # Objective-C launcher glue, and the upstream QuakeSpasm HTML manual.
    index_quality_min_lines: 1000
    verdict:
      fail_on:
        high: 0
      warn_on:
        medium: 0
        low: 0
